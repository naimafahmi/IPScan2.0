[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ipscan"
version = "0.1.0"
description = "Detection of novel intronic polyadenylation events from RNA-seq coverage."
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "pysam",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ipscan = "ipscan:main"

[tool.setuptools]
py-modules = ["ipscan"]

[tool.setuptools.packages.find]
include = ["methods*"]