# Copy this file to a private configuration file if a config file is needed.
# Prefer the command-line interface documented in README.md for reproducible runs.

[PARAMETERS]
species = hg38
annotation_file = /absolute/path/to/annotation.tsv
mode = single
sample1 = /absolute/path/to/sample1_coverage
sample2 =
output_dir = /absolute/path/to/output
cores = 1

[LOGGING]
log_dir = /absolute/path/to/logs